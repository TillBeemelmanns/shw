[package]
name = "shw"
version = "0.2.1"
edition = "2021"
description = "Blazing fast terminal viewer for images, videos and GitHub-flavored Markdown using the kitty graphics protocol"
license = "MIT"
repository = "https://github.com/TillBeemelmanns/shw"
homepage = "https://github.com/TillBeemelmanns/shw"
readme = "README.md"
keywords = ["kitty", "terminal", "image-viewer", "markdown", "video"]
categories = ["command-line-utilities", "multimedia", "visualization"]
exclude = [".github/", "assets/demo*"]

[[bin]]
name = "shw"
path = "src/main.rs"

[dependencies]
anyhow = "1"
base64 = "0.23"
clap = { version = "4.5", features = ["derive", "wrap_help", "env"] }
clap_complete = "4.5"
crossterm = "0.29"
emojis = "0.9"
fast_image_resize = "6"
flate2 = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "tiff", "ico", "pnm", "qoi", "tga", "dds", "hdr", "rayon"] }
libc = "0.2"
pulldown-cmark = { version = "0.13", default-features = false }
resvg = "0.50"
serde_json = "1"
syntect = { version = "5", default-features = false, features = ["default-fancy"] }
unicode-width = "0.2"
ureq = { version = "3.5", optional = true }

[features]
default = ["remote"]
# Fetch images / files over http(s) (markdown images, URL arguments).
remote = ["dep:ureq"]

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
opt-level = 3
panic = "abort"
